<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Квиз для фитнес-клуба — демо</title>
<style>
:root{--ink:#14181f;--acc:#4c5bf0;--bg:#f5f7fb;--card:#fff;--mut:#525d6f;--line:#e1e7f0}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:540px;margin:0 auto;padding:16px 16px 40px}
.demo{background:#fff3cd;border:1px solid #f1d98a;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:12px}
.bar{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar div{height:100%;background:var(--acc);transition:width .25s ease}
h1{font-size:24px;margin:0 0 6px}p.sub{color:var(--mut);margin:0 0 16px;font-size:14.5px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
.opt:hover,.opt.on{border-color:var(--acc);background:#eef0ff;color:var(--acc)}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:6px 0}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:8px}
#box{white-space:pre-wrap;background:#eef2f8;border-radius:10px;padding:12px;font-size:13px;margin-top:12px;display:none}
</style></head><body><div class="wrap">
<div class="demo">Демо-проект. Фитнес-клуб вымышленный. В рабочем проекте ответы приходят тренеру или менеджеру в Telegram.</div>
<div class="card">
  <h1>Подбор программы тренировок</h1>
  <p class="sub">Ответьте на 3 вопроса и получите бесплатную пробную тренировку</p>
  <div class="bar"><div id="prog" style="width:33%"></div></div>
  <div id="stepBox"></div>
  <div id="box"></div>
</div></div>
<script>
const STEPS=[
  {q:"1. Какая ваша главная цель?",a:["Сбросить вес и подтянуть тело","Набрать мышечную массу","Укрепить спину и здоровье","Поддерживать тонус и энергию"]},
  {q:"2. Какой у вас опыт тренировок?",a:["Новичок, никогда не занимался","Занимался давно, был перерыв","Тренируюсь регулярно"]},
  {q:"3. В какое время вам удобнее ходить?",a:["Утром (до 12:00)","Днём (12:00 – 17:00)","Вечером (после 17:00)","В выходные дни"]}
];
let cur=0,ans=[];
const box=document.getElementById("stepBox"),prog=document.getElementById("prog");
function draw(){
  if(cur<STEPS.length){
    prog.style.width=((cur+1)/STEPS.length*100)+"%";
    const s=STEPS[cur];
    box.innerHTML=`<h3 style="margin:0 0 12px">${s.q}</h3>`+s.a.map(x=>`<button class="opt">${x}</button>`).join("");
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans.push(b.textContent);cur++;draw()});
  }else{
    box.innerHTML=`<h3 style="margin:0 0 8px">Отлично! Программа подобрана</h3>
    <p style="color:#525d6f;font-size:14px;margin:0 0 10px">Оставьте имя и телефон, чтобы закрепить купон на бесплатное пробное занятие с тренером:</p>
    <input id="nm" placeholder="Ваше имя"><input id="ph" type="tel" placeholder="+7 ___ ___-__-__">
    <button class="btn" id="send">Получить пробную тренировку</button>
    <button class="opt" id="agn" style="margin-top:8px;text-align:center">Пройти заново</button>`;
    document.getElementById("agn").onclick=()=>{cur=0;ans=[];document.getElementById("box").style.display="none";draw()};
    document.getElementById("send").onclick=()=>{
      const n=document.getElementById("nm").value.trim(),p=document.getElementById("ph").value.trim();
      if(n.length<2||p.replace(/\D/g,"").length<10){alert("Введите имя и телефон");return}
      const res=`Демо-режим, так заявка с квиза придёт в Telegram:\n\nИмя: ${n}\nТелефон: ${p}\n1) Цель: ${ans[0]}\n2) Опыт: ${ans[1]}\n3) Время: ${ans[2]}`;
      const b=document.getElementById("box");b.style.display="block";b.textContent=res;
    };
  }
}
draw();
</script></body></html>
