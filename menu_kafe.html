<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кофейня «Мята» — онлайн-меню</title>
<style>
:root{--g:#1f5a45;--g2:#e8f3ee;--ink:#1c2a25;--bg:#fbfaf6;--line:#e3e8e2;--acc:#d9822b;--mut:#6a7a73}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:96px}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px}
.demo{background:#fff3cd;border:1px solid #f1d98a;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
header{padding:10px 0 6px}
h1{font-size:28px;margin:0;color:var(--g)}
header p{margin:4px 0 0;color:var(--mut);font-size:15px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0;position:sticky;top:0;background:var(--bg);z-index:2;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:9px 15px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:500;cursor:pointer;user-select:none;transition:.15s}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g);font-weight:600}
.it{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.it-info{flex:1;min-width:0}
.it-info b{font-weight:600;font-size:16px;display:block}
.it-info small{color:var(--mut);font-size:13.5px}
.it-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.pr{font-weight:700;white-space:nowrap;font-size:16px}
.ctl{display:flex;align-items:center;gap:8px;justify-content:flex-end;min-width:104px}
.ctl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:20px;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center}
.ctl button:active{background:var(--g2)}
.ctl b{min-width:20px;text-align:center}
.ctl .add{width:100%;padding:0 14px;background:var(--g2);color:var(--g);font-size:15px;font-weight:700;border-color:var(--g2)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px;z-index:3}
.bar button{display:block;width:100%;max-width:560px;margin:0 auto;padding:15px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;font-size:17px;font-family:inherit;cursor:pointer}
.bar button:disabled{background:#c9cfcb;cursor:default}
dialog{border:0;border-radius:18px;padding:18px;width:min(92vw,480px);max-height:88vh;background:#fff;color:var(--ink)}
dialog::backdrop{background:#0006}
.dlg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
dialog h2{margin:0;font-size:22px}
.clr-btn{border:0;background:none;color:var(--mut);font-size:13px;cursor:pointer;padding:4px 6px}
#lines{max-height:34vh;overflow-y:auto;padding-right:2px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0}
.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;font-size:15px}
.ln-name{flex:1;min-width:0}
.ln-ctl{display:flex;align-items:center;gap:6px}
.ln-ctl button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer}
.ln-sum{font-weight:600;min-width:68px;text-align:right;white-space:nowrap}
.tot-row{display:flex;justify-content:space-between;padding:10px 0 6px;font-size:17px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;margin:5px 0;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus{border-color:var(--g)}
.row2{display:flex;gap:8px;margin-top:8px}
.row2 button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;cursor:pointer}
.row2 .ok{background:var(--g);color:#fff;border-color:var(--g)}
#box{white-space:pre-wrap;background:#f1f4f2;border-radius:10px;padding:10px;font-size:13px;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="demo" id="demo" hidden>Демо-проект. Заказ не отправляется, пока не указан Telegram в CONFIG.</div>
  <header>
    <h1 id="ttl"></h1>
    <p id="sub"></p>
  </header>
  <div class="tabs" id="tabs"></div>
  <div id="menu"></div>
</div>

<div class="bar"><button type="button" id="cart" disabled>Корзина пуста</button></div>

<dialog id="dlg">
  <div class="dlg-head">
    <h2>Ваш заказ</h2>
    <button type="button" class="clr-btn" id="clrCart">Очистить</button>
  </div>
  <div id="lines"></div>
  <div class="tot-row"><b>Итого</b><b id="tot"></b></div>
  <input id="nm" placeholder="Ваше имя" autocomplete="name">
  <select id="where">
    <option value="Здесь, за столиком">Здесь, за столиком</option>
    <option value="С собой">С собой</option>
  </select>
  <input id="tb" placeholder="Номер столика (например, 5)">
  <div class="row2">
    <button type="button" id="cl">Назад</button>
    <button type="button" class="ok" id="ok">Отправить заказ</button>
  </div>
  <div id="box"></div>
</dialog>

<script>
// ===== НАСТРОЙКИ ПОД КЛИЕНТА =====
const CONFIG = {
  name: "Кофейня «Мята»",
  slogan: "Свежая выпечка и спешелти-кофе • Заказ с телефона",
  telegram: "ramiltools",
  menu: {
    "Кофе": [["Эспрессо","30 мл",120],["Капучино","250 мл",190],["Латте","300 мл",210],["Раф ванильный","300 мл",250]],
    "Чай": [["Чай чёрный","400 мл",140],["Чай облепиховый","400 мл",190],["Матча-латте","300 мл",260]],
    "Десерты": [["Чизкейк","120 г",230],["Круассан с миндалём","90 г",170],["Брауни","100 г",160]],
    "Завтраки": [["Сырники со сметаной","3 шт",290],["Омлет с зеленью","220 г",270],["Сэндвич с лососем","210 г",340]]
  }
};
// =================================

const $ = id => document.getElementById(id);
const cart = {};
let tab = Object.keys(CONFIG.menu)[0];
const fmt = n => n.toLocaleString("ru-RU").replace(/\s/g, "\u00a0") + "\u00a0₽";
const isDemo = CONFIG.telegram.includes("[") || !CONFIG.telegram.trim();
if (isDemo) $("demo").hidden = false;

$("ttl").textContent = CONFIG.name;
$("sub").textContent = CONFIG.slogan;

function getCatCount(cat) {
  return Object.entries(cart).reduce((acc, [id, q]) => id.startsWith(cat + "|") ? acc + q : acc, 0);
}

function tabs() {
  $("tabs").innerHTML = Object.keys(CONFIG.menu).map(k => {
    const cnt = getCatCount(k);
    return `<button type="button" class="${k === tab ? "on" : ""}" data-k="${k}">${k}${cnt ? ` · ${cnt}` : ""}</button>`;
  }).join("");

  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    tab = b.dataset.k;
    tabs();
    menu();
    const activeBtn = $("tabs").querySelector(".on");
    if (activeBtn) activeBtn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
  });
}

function changeQty(id, delta) {
  cart[id] = Math.max(0, (cart[id] || 0) + delta);
  if (!cart[id]) delete cart[id];
  tabs();
  menu();
  bar();
}

function menu() {
  $("menu").innerHTML = CONFIG.menu[tab].map((m, i) => {
    const id = tab + "|" + i, q = cart[id] || 0;
    return `<div class="it">
      <div class="it-info"><b>${m[0]}</b><small>${m[1]}</small></div>
      <div class="it-right">
        <div class="pr">${fmt(m[2])}</div>
        <div class="ctl">${q
          ? `<button type="button" data-d="-1" data-id="${id}">−</button><b>${q}</b><button type="button" data-d="1" data-id="${id}">+</button>`
          : `<button type="button" class="add" data-d="1" data-id="${id}">Добавить</button>`}
        </div>
      </div>
    </div>`;
  }).join("");

  $("menu").querySelectorAll("button").forEach(b => b.onclick = () => changeQty(b.dataset.id, +b.dataset.d));
}

function items() {
  return Object.entries(cart).map(([id, q]) => {
    const [c, i] = id.split("|");
    const m = CONFIG.menu[c][+i];
    return { id, n: m[0], q, s: m[2] * q };
  });
}

function bar() {
  const it = items(), t = it.reduce((a, x) => a + x.s, 0), n = it.reduce((a, x) => a + x.q, 0);
  $("cart").disabled = !n;
  $("cart").textContent = n ? `Корзина: ${n} поз. на ${fmt(t)}` : "Корзина пуста";
}

function renderDialogLines() {
  const it = items();
  if (!it.length) {
    $("dlg").close();
    return;
  }
  $("lines").innerHTML = it.map(x => `
    <div class="ln">
      <span class="ln-name">${x.n}</span>
      <div class="ln-ctl">
        <button type="button" data-d="-1" data-id="${x.id}">−</button>
        <b>${x.q}</b>
        <button type="button" data-d="1" data-id="${x.id}">+</button>
      </div>
      <span class="ln-sum">${fmt(x.s)}</span>
    </div>`).join("");
  $("tot").textContent = fmt(it.reduce((a, x) => a + x.s, 0));

  $("lines").querySelectorAll("button").forEach(b => b.onclick = () => {
    changeQty(b.dataset.id, +b.dataset.d);
    renderDialogLines();
  });
}

// Смена подсказки при выборе «За столиком» / «С собой»
$("where").onchange = () => {
  $("tb").placeholder = $("where").value === "С собой"
    ? "К какому времени приготовить? (например, 12:00)"
    : "Номер столика (например, 5)";
};

$("cart").onclick = () => {
  renderDialogLines();
  $("box").style.display = "none";
  // Временно убираем автофокус с поля имени, чтобы клавиатура не закрывала список заказа
  $("nm").readOnly = true;
  $("dlg").showModal();
  $("lines").scrollTop = 0;
  setTimeout(() => { $("nm").readOnly = false; }, 100);
};

$("clrCart").onclick = () => {
  Object.keys(cart).forEach(k => delete cart[k]);
  tabs();
  menu();
  bar();
  $("dlg").close();
};

$("cl").onclick = () => $("dlg").close();

$("ok").onclick = () => {
  const nm = $("nm").value.trim();
  if (nm.length < 2) {
    alert("Пожалуйста, укажите ваше имя");
    $("nm").focus();
    return;
  }
  const it = items();
  const sum = it.reduce((a, x) => a + x.s, 0);
  const details = $("tb").value.trim();
  const whereLine = $("where").value + (details ? `: ${details}` : "");

  const t = `☕ Новый заказ — ${CONFIG.name}\n` +
            `👤 Имя: ${nm}\n` +
            `📍 Получение: ${whereLine}\n\n` +
            `📋 Состав заказа:\n` +
            it.map(x => `• ${x.n} × ${x.q} — ${fmt(x.s)}`).join("\n") +
            `\n\n💰 Итого: ${fmt(sum)}`;

  if (isDemo) {
    const b = $("box");
    b.style.display = "block";
    b.textContent = "Демо-режим, так заказ придёт на кассу:\n\n" + t;
  } else {
    $("dlg").close();
    window.location.href = "https://t.me/" + CONFIG.telegram + "?text=" + encodeURIComponent(t);
  }
};

tabs();
menu();
bar();
</script>
</body>
</html>
