      <text x="556" y="76" fill="#4c5bf0" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="end">24 м²</text>
      <rect x="16" y="90" width="540" height="6" rx="3" fill="#e2e8f0"/>
      <rect x="16" y="90" width="220" height="6" rx="3" fill="#4c5bf0"/>
      <circle cx="236" cy="93" r="9" fill="#4c5bf0" stroke="#ffffff" stroke-width="2"/>

      <!-- Texture options -->
      <text x="0" y="132" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Фактура полотна:</text>
      <g transform="translate(0, 142)">
