        <text x="90" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">✓ Матовый (хит)</text>
        
        <rect x="195" y="0" width="180" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="285" y="24" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Глянцевый</text>

        <rect x="390" y="0" width="182" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="481" y="24" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Сатиновый</text>
