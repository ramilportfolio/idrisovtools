<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="700" height="420" fill="#0f172a"/>
  
  <g transform="translate(40, 24)" filter="url(#shadow)">
    <rect width="620" height="372" rx="14" fill="#f8fafc"/>
    <path d="M0 14 C0 6.27 6.27 0 14 0 L606 0 C613.73 0 620 6.27 620 14 L620 38 L0 38 Z" fill="#e2e8f0"/>
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="19" r="5" fill="#10b981"/>
    <text x="310" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Квиз-опросник фитнес-клуба</text>

    <g transform="translate(24, 52)">
      <!-- Progress Bar -->
      <text x="0" y="16" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-transform="uppercase">Вопрос 1 из 3 • 33% пройдено</text>
      <rect x="0" y="26" width="572" height="6" rx="3" fill="#e2e8f0"/>
      <rect x="0" y="26" width="190" height="6" rx="3" fill="#f43f5e"/>

      <!-- Question -->
      <text x="0" y="64" fill="#0f172a" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Какая ваша основная цель тренировок?</text>
      <text x="0" y="84" fill="#64748b" font-family="system-ui, sans-serif" font-size="12.5">Подберём тренера и бесплатную программу питания под ваш ритм</text>

      <!-- Options -->
      <g transform="translate(0, 100)">
        <!-- Option 1: Selected -->
        <rect x="0" y="0" width="572" height="46" rx="10" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="20" y="28" fill="#e11d48" font-family="system-ui, sans-serif" font-size="14" font-weight="700">🔥 Сбросить лишний вес и подсушиться</text>
        <circle cx="546" cy="23" r="10" fill="#f43f5e"/>
        <text x="546" y="27" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">✓</text>

        <!-- Option 2 -->
        <rect x="0" y="56" width="572" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="20" y="84" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="600">💪 Набрать мышечную массу и рельеф</text>
        <circle cx="546" cy="79" r="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>

        <!-- Option 3 -->
        <rect x="0" y="112" width="572" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="20" y="140" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="600">⚡ Повысить выносливость, тонус и здоровье спины</text>
        <circle cx="546" cy="135" r="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      </g>

      <!-- Next Button -->
      <rect x="0" y="272" width="572" height="40" rx="10" fill="#f43f5e"/>
      <text x="286" y="297" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Далее к следующему вопросу (1/3) →</text>
    </g>
  </g>
</svg>
