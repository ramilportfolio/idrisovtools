<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="700" height="420" fill="#0f172a"/>
  
  <g transform="translate(40, 24)" filter="url(#shadow)">
    <rect width="620" height="372" rx="14" fill="#f8fafc"/>
    <path d="M0 14 C0 6.27 6.27 0 14 0 L606 0 C613.73 0 620 6.27 620 14 L620 38 L0 38 Z" fill="#e2e8f0"/>
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="19" r="5" fill="#10b981"/>
    <text x="310" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Калькулятор сметы ремонта</text>

    <g transform="translate(24, 52)">
      <text x="0" y="20" fill="#0f172a" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Калькулятор ремонта квартир</text>
      <text x="0" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Прозрачный расчёт по смете • Договор и фиксированная цена</text>

      <!-- Repair Type Selection -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="180" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="14" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ЭКОНОМ</text>
        <text x="14" y="42" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Косметический</text>

        <rect x="195" y="0" width="180" height="54" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="209" y="24" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ХИТ • ПОД КЛЮЧ</text>
        <text x="209" y="42" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Капитальный</text>

        <rect x="390" y="0" width="182" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="404" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ПРЕМИУМ</text>
        <text x="404" y="42" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Дизайнерский</text>
      </g>

      <!-- Area Slider -->
      <g transform="translate(0, 118)">
        <rect x="0" y="0" width="572" height="58" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="16" y="26" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Площадь помещения:</text>
        <text x="556" y="26" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="end">62 м²</text>
        <rect x="16" y="38" width="540" height="6" rx="3" fill="#e2e8f0"/>
        <rect x="16" y="38" width="310" height="6" rx="3" fill="#3b82f6"/>
        <circle cx="326" cy="41" r="9" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
      </g>

