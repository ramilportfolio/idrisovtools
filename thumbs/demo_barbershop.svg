        <text x="130" y="20" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">15:30</text>

        <rect x="180" y="0" width="80" height="30" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
        <text x="220" y="20" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">17:00</text>

        <rect x="270" y="0" width="80" height="30" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
        <text x="310" y="20" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">18:30</text>
