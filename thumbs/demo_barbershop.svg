        <text x="285" y="22" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Артём (Топ-барбер)</text>

        <rect x="390" y="0" width="182" height="34" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
