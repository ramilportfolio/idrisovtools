<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="700" height="420" fill="#0f172a"/>
  
  <g transform="translate(40, 24)" filter="url(#shadow)">
    <rect width="620" height="372" rx="14" fill="#18181b"/>
    <path d="M0 14 C0 6.27 6.27 0 14 0 L606 0 C613.73 0 620 6.27 620 14 L620 38 L0 38 Z" fill="#27272a"/>
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="19" r="5" fill="#10b981"/>
    <text x="310" y="24" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Барбершоп «Blade &amp; Beard» • Онлайн-запись</text>

    <g transform="translate(24, 52)">
      <text x="0" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Выберите услугу и время</text>
      <text x="0" y="38" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Премиальные стрижки, уход за бородой и напитки</text>

      <!-- Services Row -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="280" height="60" rx="10" fill="#27272a" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="16" y="26" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ВЫБРАНА УСЛУГА</text>
        <text x="16" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">✂️ Мужская стрижка • 1 200 ₽</text>

        <rect x="292" y="0" width="280" height="60" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
        <text x="308" y="26" fill="#71717a" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ДОПОЛНИТЕЛЬНО</text>
        <text x="308" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">🧔 Моделирование бороды • 800 ₽</text>
      </g>

      <!-- Masters -->
      <text x="0" y="136" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Мастер:</text>
