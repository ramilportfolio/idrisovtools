<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="700" height="420" fill="#0f172a"/>
  
  <!-- App Window Container -->
  <g transform="translate(40, 24)" filter="url(#shadow)">
    <!-- Window Bar -->
    <rect width="620" height="372" rx="14" fill="#f8fafc"/>
    <path d="M0 14 C0 6.27 6.27 0 14 0 L606 0 C613.73 0 620 6.27 620 14 L620 38 L0 38 Z" fill="#e2e8f0"/>
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="19" r="5" fill="#10b981"/>
    <text x="310" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Калькулятор стоимости уборки</text>

    <!-- App Body -->
    <g transform="translate(24, 52)">
      <!-- Title -->
      <text x="0" y="20" fill="#0f172a" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Сколько стоит уборка?</text>
      <text x="0" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Интерактивный расчёт стоимости под ваши параметры</text>

      <!-- Field 1: Area -->
      <rect x="0" y="52" width="572" height="62" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="76" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Площадь помещения:</text>
      <text x="556" y="76" fill="#0d9488" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="end">54 м²</text>
      <!-- Slider line -->
      <rect x="16" y="92" width="540" height="6" rx="3" fill="#e2e8f0"/>
      <rect x="16" y="92" width="260" height="6" rx="3" fill="#0d9488"/>
      <circle cx="276" cy="95" r="9" fill="#0d9488" stroke="#ffffff" stroke-width="2"/>

      <!-- Field 2: Service Type -->
      <rect x="0" y="124" width="280" height="58" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
      <text x="16" y="148" fill="#0d9488" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ТИП УБОРКИ</text>
      <text x="16" y="168" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Генеральная • 110 ₽/м²</text>

      <!-- Field 3: Windows -->
      <rect x="292" y="124" width="280" height="58" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="308" y="148" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">МОЙКА ОКОН</text>
      <text x="308" y="168" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="700">+2 окна • 700 ₽</text>

      <!-- Total Box -->
      <rect x="0" y="194" width="572" height="60" rx="10" fill="#0f172a"/>
      <text x="20" y="222" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-transform="uppercase">Итого по смете:</text>
      <text x="20" y="244" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="22" font-weight="800">6 640 ₽</text>
      
      <!-- CTA Button -->
      <rect x="360" y="206" width="196" height="38" rx="8" fill="#0d9488"/>
      <text x="458" y="230" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Отправить заявку →</text>
    </g>
  </g>
</svg>
