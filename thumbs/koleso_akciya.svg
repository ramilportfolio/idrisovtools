<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="700" height="420" fill="#0f172a"/>
  
  <g transform="translate(40, 24)" filter="url(#shadow)">
    <rect width="620" height="372" rx="14" fill="#0b0f19"/>
    <path d="M0 14 C0 6.27 6.27 0 14 0 L606 0 C613.73 0 620 6.27 620 14 L620 38 L0 38 Z" fill="#1e293b"/>
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="19" r="5" fill="#10b981"/>
    <text x="310" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Колесо призов • Промо-акция</text>

    <!-- Content: Wheel Center -->
    <g transform="translate(310, 200)">
      <!-- Slices -->
      <path d="M 0 0 L 0 -110 A 110 110 0 0 1 77.8 -77.8 Z" fill="#3b82f6" stroke="#fff" stroke-width="2"/>
      <path d="M 0 0 L 77.8 -77.8 A 110 110 0 0 1 110 0 Z" fill="#8b5cf6" stroke="#fff" stroke-width="2"/>
      <path d="M 0 0 L 110 0 A 110 110 0 0 1 77.8 77.8 Z" fill="#ec4899" stroke="#fff" stroke-width="2"/>
      <path d="M 0 0 L 77.8 77.8 A 110 110 0 0 1 0 110 Z" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
      <path d="M 0 0 L 0 110 A 110 110 0 0 1 -77.8 77.8 Z" fill="#10b981" stroke="#fff" stroke-width="2"/>
      <path d="M 0 0 L -77.8 77.8 A 110 110 0 0 1 -110 0 Z" fill="#06b6d4" stroke="#fff" stroke-width="2"/>
      <path d="M 0 0 L -110 0 A 110 110 0 0 1 -77.8 -77.8 Z" fill="#e11d48" stroke="#fff" stroke-width="2"/>
      <path d="M 0 0 L -77.8 -77.8 A 110 110 0 0 1 0 -110 Z" fill="#6366f1" stroke="#fff" stroke-width="2"/>

      <!-- Outer Ring -->
      <circle cx="0" cy="0" r="110" fill="none" stroke="#fbbf24" stroke-width="6"/>

      <!-- Center Hub -->
      <circle cx="0" cy="0" r="28" fill="#d97706" stroke="#ffffff" stroke-width="3"/>
      <text x="0" y="6" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🎯</text>

      <!-- Pointer Top -->
      <polygon points="0,-124 -10,-102 10,-102" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Side Text & Spin Button -->
    <text x="50" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Испытайте удачу!</text>
    <text x="50" y="104" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Крутите колесо и заберите персональный промокод</text>

    <!-- Button -->
    <g transform="translate(190, 326)">
      <rect x="0" y="0" width="240" height="42" rx="10" fill="url(#btnGrad)" stroke="#f59e0b" stroke-width="1"/>
      <defs>
        <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f59e0b"/>
          <stop offset="100%" stop-color="#d97706"/>
        </linearGradient>
      </defs>
      <text x="120" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">КРУТИТЬ КОЛЕСО! 🎁</text>
    </g>
  </g>
</svg>
