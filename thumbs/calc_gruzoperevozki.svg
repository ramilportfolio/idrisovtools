<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="700" height="420" fill="#0f172a"/>
  
  <g transform="translate(40, 24)" filter="url(#shadow)">
    <rect width="620" height="372" rx="14" fill="#f8fafc"/>
    <path d="M0 14 C0 6.27 6.27 0 14 0 L606 0 C613.73 0 620 6.27 620 14 L620 38 L0 38 Z" fill="#e2e8f0"/>
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="19" r="5" fill="#10b981"/>
    <text x="310" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Калькулятор грузоперевозки</text>

    <g transform="translate(24, 52)">
      <text x="0" y="20" fill="#0f172a" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Расчёт стоимости перевозки</text>
      <text x="0" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Подача автомобиля за 20 минут • Опытные грузчики</text>

      <!-- Vehicle Selection -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="280" height="56" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
        <text x="16" y="26" fill="#f97316" font-family="system-ui, sans-serif" font-size="11" font-weight="700">АВТОМОБИЛЬ (ВЫБРАН)</text>
        <text x="16" y="44" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="800">🚚 Газель Стандарт 3м (1.5т)</text>

        <rect x="292" y="0" width="280" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="308" y="26" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ДРУГОЙ ВАРИАНТ</text>
        <text x="308" y="44" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="600">🚛 Газель Удлинённая 4.2м</text>
      </g>

      <!-- Steppers: Hours & Movers -->
      <g transform="translate(0, 120)">
        <rect x="0" y="0" width="280" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="16" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Время аренды:</text>
        <rect x="170" y="14" width="30" height="32" rx="6" fill="#f1f5f9"/>
        <text x="185" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">−</text>
        <text x="215" y="35" fill="#f97316" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">2 ч</text>
        <rect x="235" y="14" width="30" height="32" rx="6" fill="#f97316"/>
        <text x="250" y="35" fill="#fff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">+</text>

        <rect x="292" y="0" width="280" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="308" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Грузчики:</text>
        <rect x="462" y="14" width="30" height="32" rx="6" fill="#f1f5f9"/>
        <text x="477" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">−</text>
        <text x="507" y="35" fill="#f97316" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">2 чел</text>
        <rect x="527" y="14" width="30" height="32" rx="6" fill="#f97316"/>
        <text x="542" y="35" fill="#fff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">+</text>
      </g>

      <!-- Total Box -->
      <rect x="0" y="194" width="572" height="62" rx="10" fill="#0f172a"/>
      <text x="20" y="222" fill="#fdba74" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-transform="uppercase">Итого к оплате:</text>
      <text x="20" y="246" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">4 200 ₽</text>
      <text x="135" y="244" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">(Машина + 2 грузчика на 2 часа)</text>

      <rect x="360" y="206" width="196" height="40" rx="8" fill="#f97316"/>
      <text x="458" y="231" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Заказать машину →</text>
    </g>
  </g>
</svg>
