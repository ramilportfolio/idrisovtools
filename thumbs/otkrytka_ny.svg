<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="nyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1d3a"/>
      <stop offset="100%" stop-color="#1a3a6b"/>
    </linearGradient>
  </defs>
  <rect width="700" height="420" fill="#0f172a"/>
  
  <g transform="translate(40, 24)" filter="url(#shadow)">
    <rect width="620" height="372" rx="14" fill="url(#nyBg)"/>
    <path d="M0 14 C0 6.27 6.27 0 14 0 L606 0 C613.73 0 620 6.27 620 14 L620 38 L0 38 Z" fill="#13274f"/>
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="19" r="5" fill="#10b981"/>
    <text x="310" y="24" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Новогодняя интерактивная открытка</text>

    <!-- Falling snow decorative dots -->
    <circle cx="90" cy="80" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="160" cy="140" r="2" fill="#ffffff" opacity="0.4"/>
    <circle cx="280" cy="90" r="3.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="480" cy="110" r="2" fill="#ffffff" opacity="0.5"/>
    <circle cx="540" cy="70" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="580" cy="160" r="2.5" fill="#ffffff" opacity="0.6"/>

    <!-- Content -->
    <g transform="translate(310, 150)">
      <!-- 3D Gift Box Emoji / Graphic -->
      <text x="0" y="20" font-size="80" text-anchor="middle">🎁</text>
    </g>

    <text x="310" y="240" fill="#ffd166" font-family="system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle">С Новым Годом, Андрей!</text>
    <text x="310" y="268" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Пусть 2026 год принесёт новые победы и процветание вашему бизнесу! ❄️</text>

    <!-- Action buttons -->
    <g transform="translate(140, 296)">
      <rect x="0" y="0" width="160" height="40" rx="10" fill="#ffd166"/>
      <text x="80" y="25" fill="#0b1d3a" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Подарок внутри ✨</text>

      <rect x="175" y="0" width="165" height="40" rx="10" fill="rgba(255,255,255,0.15)" stroke="#ffffff" stroke-width="1"/>
      <text x="257" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Создать свою ссылку</text>
    </g>
  </g>
</svg>
