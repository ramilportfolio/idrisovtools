<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="700" height="420" fill="#0f172a"/>
  
  <g transform="translate(40, 24)" filter="url(#shadow)">
    <rect width="620" height="372" rx="14" fill="#f8fafc"/>
    <path d="M0 14 C0 6.27 6.27 0 14 0 L606 0 C613.73 0 620 6.27 620 14 L620 38 L0 38 Z" fill="#e2e8f0"/>
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="19" r="5" fill="#10b981"/>
    <text x="310" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Калькулятор химчистки мебели</text>

    <g transform="translate(24, 52)">
      <text x="0" y="20" fill="#0f172a" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Химчистка диванов и матрасов</text>
      <text x="0" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Выезд мастера на дом • Безопасная гипоаллергенная химия</text>

      <!-- Stepper: Seats -->
      <rect x="0" y="52" width="572" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="87" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Количество посадочных мест:</text>
      <!-- Stepper buttons -->
      <rect x="420" y="66" width="34" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="437" y="88" fill="#0f172a" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">−</text>
      <text x="485" y="88" fill="#6366f1" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">3</text>
      <rect x="522" y="66" width="34" height="34" rx="8" fill="#6366f1"/>
      <text x="539" y="88" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">+</text>

      <!-- Addons Checkboxes -->
      <rect x="0" y="122" width="280" height="58" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
      <circle cx="26" cy="151" r="9" fill="#6366f1"/>
      <text x="26" y="155" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">✓</text>
      <text x="46" y="145" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Удаление пятен и запаха</text>
      <text x="46" y="163" fill="#6366f1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">+600 ₽</text>

      <rect x="292" y="122" width="280" height="58" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="318" cy="151" r="9" fill="#e2e8f0"/>
      <text x="338" y="145" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Экспресс-сушка мебели</text>
      <text x="338" y="163" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">+500 ₽</text>

      <!-- Total Box -->
      <rect x="0" y="192" width="572" height="62" rx="10" fill="#1e1b4b"/>
      <text x="20" y="220" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-transform="uppercase">Итоговый расчёт:</text>
      <text x="20" y="244" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">3 900 ₽</text>
      <text x="140" y="242" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12">(~2 часа работы)</text>
      
      <rect x="360" y="204" width="196" height="40" rx="8" fill="#6366f1"/>
      <text x="458" y="229" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Заказать химчистку →</text>
    </g>
  </g>
</svg>
