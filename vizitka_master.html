<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Алина • Бровист и ламимейкер — Онлайн-запись</title>
<style>
:root{--ink:#14181f;--acc:#4c5bf0;--acc-soft:#eef0ff;--bg:#f5f7fb;--card:#fff;--mut:#525d6f;--line:#e1e7f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:540px;margin:0 auto;padding:16px 16px 40px}
.demo{background:#fff3cd;border:1px solid #f1d98a;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:12px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.ava{width:68px;height:68px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--line)}
.price-hint{font-size:12.5px;color:var(--mut);margin:-4px 0 8px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 10px;margin:0 -10px;border-bottom:1px solid var(--line);border-radius:10px;cursor:pointer;user-select:none;transition:background .15s}
.row:last-child{border-bottom:0}
.row:active,.row.active{background:var(--acc-soft)}
.row span{flex:1}
.row b{white-space:nowrap;flex-shrink:0;color:var(--ink)}
.row.active b{color:var(--acc)}
input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;margin:6px 0;background:#fff;color:var(--ink);outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--acc)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:8px;transition:transform .1s}
.btn:active{transform:scale(0.99)}
#box{white-space:pre-wrap;background:#eef2f8;border-radius:10px;padding:12px;font-size:13px;margin-top:12px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="demo" id="demo" hidden>Демо-проект визитки частного мастера. Укажите ник Telegram в CONFIG для отправки заявок.</div>

  <div class="card">
    <div class="top">
      <img class="ava" id="ava" src="" alt="Мастер">
      <div>
        <h1 id="nameTitle" style="font-size:21px;margin:0"></h1>
        <span id="subTitle" style="color:var(--mut);font-size:14px"></span>
      </div>
    </div>
    <p id="bio" style="margin:0;color:var(--mut);font-size:14.5px"></p>
  </div>

  <div class="card">
    <h3 style="margin:0 0 6px">Прайс-лист</h3>
    <div class="price-hint">Нажмите на услугу, чтобы выбрать её для записи</div>
    <div id="priceList"></div>
  </div>

  <div class="card" id="formCard">
    <h3 style="margin:0 0 8px">Быстрая запись в Telegram</h3>
    <select id="srv" aria-label="Выберите услугу"></select>
    <input id="nm" placeholder="Ваше имя" autocomplete="name">
    <input id="ph" type="tel" placeholder="+7 (___) ___-__-__" autocomplete="tel">
    <input id="tm" placeholder="Желаемый день и время (необязательно)">
    <button type="button" class="btn" id="send">Записаться к мастеру</button>
    <div id="box"></div>
  </div>
</div>

<script>
// ===== НАСТРОЙКИ ПОД КЛИЕНТА =====
const CONFIG = {
  telegram: "ramiltools", // ник мастера в Telegram без @
  masterName: "Алина • Бровист и ламимейкер",
  subtitle: "Студия в центре города • Опыт 4 года",
  bio: "Естественное оформление бровей и ламинирование ресниц. Стерильные инструменты, уютная студия, чай и кофе для гостей.",
  avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80",
  services: [
    ["Коррекция и окрашивание бровей", 900],
    ["Долговременная укладка бровей", 1300],
    ["Ламинирование ресниц + ботокс", 1600],
    ["Комплекс «Брови + Ресницы»", 2500]
  ]
};
// =================================

const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("ru-RU").replace(/\s/g, "\u00a0") + "\u00a0₽";
const isDemo = CONFIG.telegram.includes("[") || !CONFIG.telegram.trim();
if (isDemo) $("demo").hidden = false;

$("ava").src = CONFIG.avatar;
$("nameTitle").textContent = CONFIG.masterName;
$("subTitle").textContent = CONFIG.subtitle;
$("bio").textContent = CONFIG.bio;

// Отрисовка прайс-листа и выпадающего списка из единого массива
$("priceList").innerHTML = CONFIG.services.map((s, i) =>
  `<div class="row ${i === 0 ? "active" : ""}" data-idx="${i}"><span>${s[0]}</span><b>${fmt(s[1])}</b></div>`
).join("");

$("srv").innerHTML = CONFIG.services.map((s, i) =>
  `<option value="${i}">${s[0]} — ${fmt(s[1])}</option>`
).join("");

function syncActiveRow(idx) {
  document.querySelectorAll("#priceList .row").forEach((r, i) => {
    r.classList.toggle("active", i === +idx);
  });
}

document.querySelectorAll("#priceList .row").forEach(r => {
  r.onclick = () => {
    $("srv").value = r.dataset.idx;
    syncActiveRow(r.dataset.idx);
    $("formCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
  };
});

$("srv").onchange = () => syncActiveRow($("srv").value);

// Маска ввода телефона +7 (XXX) XXX-XX-XX
$("ph").addEventListener("input", e => {
  let d = e.target.value.replace(/\D/g, "");
  if (!d) { e.target.value = ""; return; }
  if (d[0] === "8" || d[0] === "7") d = d.slice(1);
  d = d.slice(0, 10);
  let res = "+7";
  if (d.length > 0) res += " (" + d.slice(0, 3);
  if (d.length >= 4) res += ") " + d.slice(3, 6);
  if (d.length >= 7) res += "-" + d.slice(6, 8);
  if (d.length >= 9) res += "-" + d.slice(8, 10);
  e.target.value = res;
});

function submitBooking() {
  const n = $("nm").value.trim();
  const p = $("ph").value.trim();
  const tm = $("tm").value.trim();
  const s = CONFIG.services[+$("srv").value];

  if (n.length < 2 || p.replace(/\D/g, "").length < 11) {
    alert("Пожалуйста, укажите ваше имя и полный номер телефона");
    return;
  }

  const text = `✨ Запись к мастеру (${CONFIG.masterName})\n` +
               `👤 Клиент: ${n}\n` +
               `📞 Телефон: ${p}\n` +
               `💅 Услуга: ${s[0]} — ${fmt(s[1])}` +
               (tm ? `\n🕒 Желаемое время: ${tm}` : "");

  if (isDemo) {
    const b = $("box");
    b.style.display = "block";
    b.textContent = "Демо-режим, так запись придёт мастеру в Telegram:\n\n" + text;
  } else {
    window.location.href = "https://t.me/" + CONFIG.telegram + "?text=" + encodeURIComponent(text);
  }
}

$("send").onclick = submitBooking;

// Отправка по нажатию Enter на клавиатуре телефона
["nm", "ph", "tm"].forEach(id => {
  $(id).addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      submitBooking();
    }
  });
});
</script>
</body>
</html>
