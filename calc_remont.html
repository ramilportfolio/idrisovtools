<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Калькулятор ремонта — демо</title>
<style>
:root {
  --ink: #161e2e;
  --acc: #6a4fd6;
  --acc-hover: #583ec0;
  --acc-soft: #f1edfc;
  --bg: #f4f6fa;
  --card: #fff;
  --mut: #5d6881;
  --line: #dfe5ef;
  --err: #c82333;
  --ok: #197a4b;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font: 16px/1.42 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
}
.wrap { max-width: 560px; margin: 0 auto; padding: 12px 16px 36px; }
.demo {
  background: #fff3cd;
  border: 1px solid #f1d98a;
  border-radius: 10px;
  padding: 7px 11px;
  font-size: 12.5px;
  margin-bottom: 10px;
}
h1 { font-size: 24px; margin: 4px 0 2px; letter-spacing: -0.01em; }
p.sub { color: var(--mut); margin: 0 0 12px; font-size: 14.5px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 12px;
}
label.t { display: block; font-weight: 600; margin: 12px 0 6px; }
label.t:first-child { margin-top: 0; }
input[type=number], input[type=text], input[type=tel], select {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 16px;
  font-family: inherit;
  color: var(--ink);
  background: #fff;
  transition: border-color .15s;
}
input:focus-visible, select:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 1px;
  border-color: var(--acc);
}
input.invalid { border-color: var(--err); background: #fff8f8; }
input[type=range] {
  width: 100%;
  accent-color: var(--acc);
  margin: 4px 0 2px;
  cursor: pointer;
}
.range-limits {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--mut);
  margin-top: -2px;
}

/* Кнопки-тарифы вместо выпадающего списка (в 1 тап, без обрыва строк) */
.seg {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
@media (max-width: 400px) {
  .seg { grid-template-columns: 1fr; }
}
.seg-item {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 9px 10px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: #fff;
  cursor: pointer;
  user-select: none;
  transition: border-color .15s, background .15s;
}
@media (max-width: 400px) {
  .seg-item {
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
  }
}
.seg-item input { position: absolute; opacity: 0; pointer-events: none; }
.seg-item b { font-size: 14.5px; font-weight: 600; color: var(--ink); }
.seg-item small { font-size: 12.5px; color: var(--mut); white-space: nowrap; margin-top: 2px; }
@media (max-width: 400px) {
  .seg-item small { margin-top: 0; }
}
.seg-item.active {
  border-color: var(--acc);
  background: var(--acc-soft);
}
.seg-item.active b { color: var(--acc); }

.rng { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.step { display: flex; align-items: center; gap: 8px; }
.step button {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: #fff;
  font-size: 20px;
  cursor: pointer;
}
.ck {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-top: 1px solid var(--line);
  cursor: pointer;
  user-select: none;
}
.ck input {
  width: 21px;
  height: 21px;
  accent-color: var(--acc);
  flex-shrink: 0;
  cursor: pointer;
}
.ck span { flex: 1; }
.ck small { color: var(--mut); white-space: nowrap; font-size: 13.5px; }

.total {
  background: var(--ink);
  color: #fff;
  border-radius: 16px;
  padding: 16px 18px;
  margin-bottom: 12px;
}
.total .sum {
  font-size: 36px;
  font-weight: 800;
  color: #fff;
  line-height: 1.15;
  margin: 2px 0 6px;
}
.total small { opacity: .8; font-size: 13px; }
.line {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 14px;
  opacity: .92;
  padding: 2.5px 0;
  gap: 12px;
}
.line span:last-child, .line b:last-child { white-space: nowrap; }
.line.term-row {
  margin-top: 4px;
  padding-top: 6px;
  border-top: 1px solid rgba(255, 255, 255, .14);
}

.err {
  color: var(--err);
  font-size: 13.5px;
  font-weight: 600;
  margin-top: 10px;
  display: none;
}
button.main {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  background: var(--acc);
  color: #fff;
  font-weight: 700;
  font-size: 17px;
  font-family: inherit;
  cursor: pointer;
  transition: background .15s;
}
button.main:hover { background: var(--acc-hover); }
#box {
  white-space: pre-wrap;
  background: #eef2f8;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  font-size: 13.5px;
  margin-top: 12px;
  display: none;
}
.copy-ok {
  display: block;
  color: var(--ok);
  font-weight: 600;
  font-size: 12.5px;
  margin-bottom: 6px;
}
.note { font-size: 12px; color: var(--mut); margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="demo" id="demo" hidden>Демо-проект для портфолио. Компания и цены условные. При отправке откроется Telegram с готовым расчётом.</div>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>

  <div class="card" id="fields"></div>

  <div class="total">
    <small>Ориентировочная стоимость</small>
    <div class="sum" id="sum">0&nbsp;₽</div>
    <div id="lines"></div>
    <div class="line term-row"><span id="termL"></span><b id="term"></b></div>
  </div>

  <div class="card">
    <label class="t" for="name">Ваше имя</label>
    <input type="text" id="name" autocomplete="given-name" autocapitalize="words" placeholder="Например, Рамиль">
    <label class="t" for="phone">Телефон</label>
    <input type="tel" id="phone" inputmode="tel" autocomplete="tel" placeholder="+7 (900) 000-00-00" maxlength="18">
    <div class="err" id="err" role="alert"></div>
    <button class="main" id="send" type="button" style="margin-top:14px">Отправить расчёт в Telegram</button>
    <div id="box"></div>
    <div class="note" id="note"></div>
  </div>
</div>

<script>
// ===== НАСТРОЙКИ ПОД КЛИЕНТА =====
const CONFIG = {
  "title": "Сколько стоит ремонт?",
  "subtitle": "Ориентировочная цена за 30 секунд (вымышленная компания «Новый дом»)",
  "telegram": "ramiltools",
  "demoBanner": true,
  "base": 0,
  "min": 50000,
  "termLabel": "Срок работ",
  "termRule": "(S.area>70?'от 50 дней':S.area>40?'от 35 дней':'от 20 дней')",
  "note": "Точную смету составит мастер после замера. Расчёт не является офертой. Цены условные.",
  "fields": [
    {
      "id": "area",
      "type": "number",
      "label": "Площадь",
      "unit": "м²",
      "min": 20,
      "max": 150,
      "def": 50,
      "step": 5
    },
    {
      "id": "kind",
      "type": "select",
      "label": "Тип ремонта",
      "per": "area",
      "options": [
        { "n": "Косметический", "p": 3500 },
        { "n": "Капитальный", "p": 6500 },
        { "n": "Дизайнерский", "p": 9500 }
      ]
    },
    {
      "id": "el",
      "type": "check",
      "label": "Электрика под ключ",
      "price": 25000
    },
    {
      "id": "pl",
      "type": "check",
      "label": "Сантехника под ключ",
      "price": 18000
    },
    {
      "id": "dem",
      "type": "check",
      "label": "Демонтаж старых покрытий",
      "price": 12000
    },
    {
      "id": "trash",
      "type": "check",
      "label": "Вывоз мусора",
      "price": 6000
    }
  ]
};
// =================================

const $ = id => document.getElementById(id);
const S = {};
const fmt = n => Math.round(n).toLocaleString("ru-RU") + "\u00A0₽";
const demo = CONFIG.telegram.includes("[");
if (demo || CONFIG.demoBanner) $("demo").hidden = false;

$("h1").textContent = CONFIG.title;
$("sub").textContent = CONFIG.subtitle;
$("note").textContent = CONFIG.note;
$("termL").textContent = CONFIG.termLabel || "Срок";

CONFIG.fields.forEach(f => {
  S[f.id] = f.type === "check" ? false : f.type === "select" ? 0 : f.def;
});

function build() {
  const box = $("fields");
  box.innerHTML = "";
  let checks = null;

  CONFIG.fields.forEach(f => {
    if (f.type === "number") {
      const l = document.createElement("div");
      const isRange = f.step && (f.max - f.min > 12);
      l.innerHTML =
        `<label class="t" for="i_${f.id}">${f.label}: <b id="o_${f.id}"></b>\u00A0${f.unit || ""}</label>` +
        (isRange
          ? `<input type="range" id="i_${f.id}" min="${f.min}" max="${f.max}" step="${f.step}" value="${f.def}">` +
            `<div class="range-limits"><span>${f.min}\u00A0${f.unit || ""}</span><span>${f.max}\u00A0${f.unit || ""}</span></div>`
          : `<div class="rng"><span></span><div class="step"><button type="button" data-id="${f.id}" data-d="-${f.step || 1}">−</button><b id="s_${f.id}"></b><button type="button" data-id="${f.id}" data-d="${f.step || 1}">+</button></div></div>`);
      box.appendChild(l);
      checks = null;
    } else if (f.type === "select") {
      const perField = f.per ? CONFIG.fields.find(x => x.id === f.per) : null;
      // \u2060 (Word Joiner) запрещает разрыв строки сразу после слэша
      const unitSuffix = perField && perField.unit ? "/\u2060" + perField.unit : "";
      const l = document.createElement("div");

      if (f.options.length <= 4) {
        l.innerHTML =
          `<label class="t">${f.label}</label>` +
          `<div class="seg" data-id="${f.id}">` +
          f.options.map((o, i) =>
            `<label class="seg-item${i === 0 ? " active" : ""}">` +
            `<input type="radio" name="r_${f.id}" value="${i}"${i === 0 ? " checked" : ""}>` +
            `<b>${o.n}</b>` +
            `<small>${o.p ? fmt(o.p) + unitSuffix : "бесплатно"}</small>` +
            `</label>`
          ).join("") +
          `</div>`;
      } else {
        l.innerHTML =
          `<label class="t" for="i_${f.id}">${f.label}</label>` +
          `<select id="i_${f.id}">` +
          f.options.map((o, i) => `<option value="${i}">${o.n} — ${o.p ? fmt(o.p) + unitSuffix : "бесплатно"}</option>`).join("") +
          `</select>`;
      }
      box.appendChild(l);
      checks = null;
    } else {
      if (!checks) {
        checks = document.createElement("div");
        checks.style.marginTop = "10px";
        box.appendChild(checks);
      }
      const d = document.createElement("label");
      d.className = "ck";
      d.innerHTML = `<input type="checkbox" id="i_${f.id}"><span>${f.label}</span><small>${f.price ? "+" + fmt(f.price) : ""}</small>`;
      checks.appendChild(d);
    }
  });

  box.querySelectorAll("input[type=range]").forEach(r => {
    r.oninput = () => { S[r.id.slice(2)] = +r.value; calc(); };
  });
  box.querySelectorAll("select").forEach(s => {
    s.onchange = () => { S[s.id.slice(2)] = +s.value; calc(); };
  });
  box.querySelectorAll(".seg").forEach(seg => {
    const id = seg.dataset.id;
    seg.querySelectorAll("input[type=radio]").forEach(rad => {
      rad.onchange = () => {
        S[id] = +rad.value;
        seg.querySelectorAll(".seg-item").forEach(lbl => lbl.classList.remove("active"));
        rad.parentElement.classList.add("active");
        calc();
      };
    });
  });
  box.querySelectorAll("input[type=checkbox]").forEach(c => {
    c.onchange = () => { S[c.id.slice(2)] = c.checked; calc(); };
  });
  box.querySelectorAll(".step button").forEach(b => {
    b.onclick = () => {
      const f = CONFIG.fields.find(x => x.id === b.dataset.id);
      S[f.id] = Math.max(f.min, Math.min(f.max, S[f.id] + +b.dataset.d));
      calc();
    };
  });
}

CONFIG.term = CONFIG.termRule ? new Function("S", "return " + CONFIG.termRule) : null;

function calc() {
  let sum = CONFIG.base || 0;
  const rows = [];
  if (CONFIG.base) rows.push(["Базовая стоимость", CONFIG.base]);

  CONFIG.fields.forEach(f => {
    if (f.type === "number") {
      const o = $("o_" + f.id);
      if (o) o.textContent = S[f.id];
      const s = $("s_" + f.id);
      if (s) s.textContent = S[f.id];
      if (f.price) {
        const v = f.price * S[f.id] * (f.times ? S[f.times] : 1);
        sum += v;
        rows.push([`${f.label} (${S[f.id]}\u00A0${f.unit || ""}${f.times ? " × " + S[f.times] : ""})`, v]);
      }
    } else if (f.type === "select") {
      const o = f.options[S[f.id]];
      const perField = f.per ? CONFIG.fields.find(x => x.id === f.per) : null;
      const perText = perField ? ` (${S[f.per]}\u00A0${perField.unit || ""})` : "";
      const v = o.p * (f.per ? S[f.per] : 1);
      const rowTitle = `${o.n} ремонт${perText}`;
      if (v) {
        sum += v;
        rows.push([rowTitle, v]);
      } else {
        rows.push([rowTitle, 0]);
      }
    } else if (S[f.id]) {
      sum += f.price;
      rows.push([f.label, f.price]);
    }
  });

  if (CONFIG.min && sum < CONFIG.min) {
    rows.push(["Доплата до минимального заказа", CONFIG.min - sum]);
    sum = CONFIG.min;
  }

  $("lines").innerHTML = rows
    .map(r => `<div class="line"><span>${r[0]}</span><span>${r[1] ? fmt(r[1]) : "входит"}</span></div>`)
    .join("");
  $("sum").textContent = fmt(sum);

  const termVal = CONFIG.term ? CONFIG.term(S) : "";
  $("term").textContent = termVal;

  S.__sum = sum;
  S.__rows = rows;
  S.__term = termVal;
}

function clearErr() {
  const err = $("err");
  err.style.display = "none";
  err.textContent = "";
  $("name").classList.remove("invalid");
  $("phone").classList.remove("invalid");
}

$("name").addEventListener("input", clearErr);

// Маска телефона +7 (900) 000-00-00
$("phone").addEventListener("input", e => {
  clearErr();
  let digits = e.target.value.replace(/\D/g, "");
  if (!digits) {
    e.target.value = "";
    return;
  }
  if (digits[0] === "7" || digits[0] === "8") {
    digits = digits.substring(1);
  }
  digits = digits.substring(0, 10);
  let res = "+7";
  if (digits.length > 0) res += " (" + digits.substring(0, 3);
  if (digits.length >= 4) res += ") " + digits.substring(3, 6);
  if (digits.length >= 7) res += "-" + digits.substring(6, 8);
  if (digits.length >= 9) res += "-" + digits.substring(8, 10);
  e.target.value = res;
});

$("send").onclick = () => {
  const n = $("name").value.trim();
  const p = $("phone").value.trim();
  const digits = p.replace(/\D/g, "");
  const err = $("err");

  if (n.length < 2) {
    $("name").classList.add("invalid");
    err.textContent = "Пожалуйста, укажите ваше имя.";
    err.style.display = "block";
    return;
  }
  if (digits.length < 11) {
    $("phone").classList.add("invalid");
    err.textContent = "Введите номер телефона полностью.";
    err.style.display = "block";
    return;
  }

  clearErr();

  const linesText = S.__rows
    .map(r => "• " + r[0] + " — " + (r[1] ? fmt(r[1]) : "входит"))
    .join("\n");
  const termLine = S.__term ? `\n⏱ ${CONFIG.termLabel || "Срок"}: ${S.__term}` : "";
  const t =
    `🛠 Заявка: ${CONFIG.title}\n` +
    `👤 Имя: ${n}\n` +
    `📞 Телефон: ${p}\n\n` +
    `📋 Расчёт:\n${linesText}${termLine}\n` +
    `💰 Итого: ${fmt(S.__sum)}`;

  const b = $("box");
  b.style.display = "block";
  b.innerHTML = `<span class="copy-ok">✓ Расчёт скопирован в буфер обмена</span>` + t;
  try { navigator.clipboard.writeText(t); } catch (e) {}

  if (!demo) {
    window.open("https://t.me/" + CONFIG.telegram + "?text=" + encodeURIComponent(t), "_blank");
  } else {
    b.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
};

build();
calc();
</script>
</body>
</html>
